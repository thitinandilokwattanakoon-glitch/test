services:
  db:
    image: postgres:16-alpine
    container_name: kinloei-db
    restart: unless-stopped
    env_file:
      - ./backend/.env   # already has POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD
    ports:
      - "5432:5432"
    volumes:
      - kinloei_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinloei -d kinloei"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  kinloei_pgdata: